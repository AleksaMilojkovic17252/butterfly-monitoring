<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" role="img" aria-labelledby="t">
  <title id="t">How the work moves between the admin, the researcher and the server</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#55615a"/></marker>
  </defs>
  <g fill="#1d2420" font-weight="700" font-size="15">
    <text x="20" y="28">Admin, at a desk (web admin)</text>
    <text x="20" y="128">Researcher, in the field (phone app, no connection needed)</text>
    <text x="20" y="228">Researcher or admin, later</text>
  </g>
  <g fill="#eef5f0" stroke="#2f7d52">
    <rect x="20" y="40" width="190" height="56" rx="8"/>
    <rect x="240" y="40" width="190" height="56" rx="8"/>
    <rect x="460" y="40" width="190" height="56" rx="8"/>
    <rect x="680" y="40" width="160" height="56" rx="8"/>
  </g>
  <g fill="#eaf2fb" stroke="#2563a8">
    <rect x="20" y="140" width="190" height="56" rx="8"/>
    <rect x="240" y="140" width="190" height="56" rx="8"/>
    <rect x="460" y="140" width="190" height="56" rx="8"/>
    <rect x="680" y="140" width="160" height="56" rx="8"/>
  </g>
  <g fill="#fdf4e3" stroke="#b7791f">
    <rect x="20" y="240" width="190" height="52" rx="8"/>
    <rect x="240" y="240" width="190" height="52" rx="8"/>
    <rect x="460" y="240" width="380" height="52" rx="8"/>
  </g>
  <g fill="#1d2420" text-anchor="middle">
    <text x="115" y="63">Create users and a</text><text x="115" y="82">project with its rules</text>
    <text x="335" y="63">Draw transects</text><text x="335" y="82">and sections</text>
    <text x="555" y="63">Check species, plant</text><text x="555" y="82">and habitat lists</text>
    <text x="760" y="63">Add researchers</text><text x="760" y="82">to the project</text>

    <text x="115" y="163">Download the project</text><text x="115" y="182">to the phone</text>
    <text x="335" y="163">Start a visit: weather,</text><text x="335" y="182">GPS route starts</text>
    <text x="555" y="163">Record butterflies,</text><text x="555" y="182">plants and habitat</text>
    <text x="760" y="163">Finish, then</text><text x="760" y="182">sync when online</text>

    <text x="115" y="262">Admin validates</text><text x="115" y="280">uncertain records</text>
    <text x="335" y="262">Admin reviews</text><text x="335" y="280">and locks visits</text>
    <text x="650" y="262">Data goes out: CSV, GeoJSON or JSON exports,</text><text x="650" y="280">OGC API for QGIS, R and Python</text>
  </g>
  <g stroke="#55615a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M210 68h28"/><path d="M430 68h28"/><path d="M650 68h28"/>
    <path d="M210 168h28"/><path d="M430 168h28"/><path d="M650 168h28"/>
    <path d="M210 266h28"/><path d="M430 266h28"/>
  </g>
</svg>
