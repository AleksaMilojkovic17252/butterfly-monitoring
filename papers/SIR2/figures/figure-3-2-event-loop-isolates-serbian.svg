<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figure 3.2. The event loop of the main isolate and a worker isolate, after the Dart
  documentation [22] (concurrency page) and the Flutter documentation [21] (isolates page;
  merged threads from the architectural overview). Read 2026-11-11.
  General figure: nothing in it describes the butterfly-monitoring app.
  All text is plain <text>, so it can be translated in Inkscape or any text editor.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="352" viewBox="0 0 840 352"
     font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a1a">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="352" fill="#ffffff"/>

  <!-- Main isolate -->
  <rect x="20" y="20" width="500" height="280" rx="6" fill="#e9eff8" stroke="#555" stroke-width="1.2"/>
  <text x="34" y="46" font-size="15" font-weight="bold">Glavni izolat</text>
  <text x="506" y="46" text-anchor="end" font-size="12" font-style="italic" fill="#444">Android: glavna nit</text>

  <text x="34" y="82">Red događaja (najstariji levo)</text>
  <rect x="34" y="94" width="120" height="36" rx="3" fill="#ffffff" stroke="#888"/>
  <text x="95" y="117" text-anchor="middle">iscrtavanje frejma</text>
  <rect x="160" y="94" width="56" height="36" rx="3" fill="#ffffff" stroke="#888"/>
  <text x="187" y="117" text-anchor="middle">klik</text>
  <rect x="220" y="94" width="92" height="36" rx="3" fill="#ffffff" stroke="#888"/>
  <text x="265" y="117" text-anchor="middle">I/O rezultati</text>
  <rect x="320" y="94" width="120" height="36" rx="3" fill="#ffffff" stroke="#888"/>
  <text x="380" y="117" text-anchor="middle">iscrtavanje frejma</text>
  <rect x="450" y="94" width="40" height="36" rx="3" fill="#ffffff" stroke="#888" stroke-dasharray="4 3"/>
  <text x="470" y="117" text-anchor="middle">…</text>

  <line x1="82" y1="130" x2="82" y2="166" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="34" y="168" width="300" height="50" rx="4" fill="#ffffff" stroke="#555"/>
  <text x="184" y="190" text-anchor="middle" font-weight="bold">Petlja događaja</text>
  <text x="184" y="208" text-anchor="middle">jedan događaj u jednom trenutku po frejmu</text>

  <rect x="350" y="168" width="156" height="50" rx="4" fill="#ffffff" stroke="#555"/>
  <text x="428" y="198" text-anchor="middle">Sopstvena memorija</text>

  <text x="34" y="252">Događaj „paint-frame“ stiže 60 puta u sekundi na ekranu od 60 Hz.</text>
  <text x="34" y="272">Dug zadatak u petlji događaja odlaže svaki događaj iza njega.</text>

  <!-- Messages between the isolates -->
  <line x1="522" y1="120" x2="598" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="110" text-anchor="middle" font-size="12" font-style="italic">poruka</text>
  <line x1="598" y1="210" x2="522" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="232" text-anchor="middle" font-size="12" font-style="italic">rezultat</text>

  <!-- Worker isolate -->
  <rect x="600" y="20" width="220" height="280" rx="6" fill="#edf5e9" stroke="#555" stroke-width="1.2"/>
  <text x="614" y="46" font-size="15" font-weight="bold">Worker izolat</text>

  <rect x="614" y="66" width="192" height="44" rx="4" fill="#ffffff" stroke="#555"/>
  <text x="710" y="93" text-anchor="middle">Sopstvena memorija</text>
  <rect x="614" y="120" width="192" height="44" rx="4" fill="#ffffff" stroke="#555"/>
  <text x="710" y="147" text-anchor="middle">Sopstvena petlja događaja</text>
  <rect x="614" y="174" width="192" height="62" rx="4" fill="#ffffff" stroke="#555"/>
  <text x="710" y="209" text-anchor="middle">Duga izračunvanja</text>

  <text x="710" y="262" text-anchor="middle" font-size="12" fill="#444">može da blokira</text>
  <text x="710" y="278" text-anchor="middle" font-size="12" fill="#444">ne utiče na druge izolate</text>

  <!-- Footnote -->
  <text x="20" y="332" font-size="12" fill="#444">Izolati ne dele memoriju; komuniciraju samo slanjem poruka. Isolate.run pokreće worker-a, izvršava jednu funkciju i vraća njen rezultat.</text>
</svg>
