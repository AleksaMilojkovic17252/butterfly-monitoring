<?xml version="1.0" encoding="UTF-8"?>
<!--
  Figure 5.2. The states of a visit and who may move it between them (section 5.2).
  Sources: docs/requirements/visit-states.json (the transition table and the actors),
  mobile/lib/features/visits/domain/visit_status.dart (the same table in Dart, the labels),
  backend/apps/surveys/state.py; D-058 (completed to synced only in the push handlers), D-070 (unlock
  goes to reviewed).
  All text is plain <text>, so it can be translated in Inkscape or any text editor.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"
     font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a1a">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-admin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6db3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="420" fill="#ffffff"/>

  <!-- where each state is set -->
  <text x="200" y="36" text-anchor="middle" font-size="15" font-weight="bold">Postavlja telefon</text>
  <text x="620" y="36" text-anchor="middle" font-size="15" font-weight="bold">Postavlja server</text>
  <line x1="410" y1="20" x2="410" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- states, main row -->
  <rect x="20" y="170" width="92" height="40" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.2"/>
  <text x="66" y="195" text-anchor="middle" font-weight="bold">Draft</text>

  <rect x="152" y="170" width="92" height="40" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.2"/>
  <text x="198" y="195" text-anchor="middle" font-weight="bold">In progress</text>

  <rect x="284" y="170" width="92" height="40" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.2"/>
  <text x="330" y="195" text-anchor="middle" font-weight="bold">Completed</text>

  <rect x="444" y="170" width="92" height="40" rx="6" fill="#e9eff8" stroke="#555" stroke-width="1.2"/>
  <text x="490" y="195" text-anchor="middle" font-weight="bold">Synced</text>

  <rect x="584" y="170" width="92" height="40" rx="6" fill="#e9eff8" stroke="#555" stroke-width="1.2"/>
  <text x="630" y="195" text-anchor="middle" font-weight="bold">Reviewed</text>

  <rect x="724" y="170" width="92" height="40" rx="6" fill="#e9eff8" stroke="#555" stroke-width="1.2"/>
  <text x="770" y="195" text-anchor="middle" font-weight="bold">Locked</text>

  <!-- cancelled -->
  <rect x="86" y="290" width="92" height="40" rx="6" fill="#f3f3f3" stroke="#555" stroke-width="1.2"/>
  <text x="132" y="315" text-anchor="middle" font-weight="bold">Cancelled</text>

  <!-- observer, in the app (solid) -->
  <line x1="112" y1="190" x2="150" y2="190" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="132" y="162" text-anchor="middle" font-size="12">Počni</text>
  <line x1="244" y1="190" x2="282" y2="190" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="264" y="162" text-anchor="middle" font-size="12">Zavši</text>
  <line x1="70" y1="210" x2="110" y2="288" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="80" y="258" text-anchor="end" font-size="12">Odustani</text>
  <line x1="194" y1="210" x2="154" y2="288" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="186" y="258" font-size="12">Odustani</text>

  <!-- server, when a push is accepted (dashed) -->
  <line x1="376" y1="190" x2="442" y2="190" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="392" y="150" width="36" height="16" fill="#ffffff"/>
  <text x="410" y="162" text-anchor="middle" font-size="12">Sinhronizacija</text>

  <!-- administrator, in Django admin (blue) -->
  <line x1="536" y1="190" x2="582" y2="190" stroke="#3b6db3" stroke-width="1.4" marker-end="url(#arrow-admin)"/>
  <text x="560" y="162" text-anchor="middle" font-size="12" fill="#3b6db3">Pregled</text>
  <line x1="676" y1="182" x2="722" y2="182" stroke="#3b6db3" stroke-width="1.4" marker-end="url(#arrow-admin)"/>
  <text x="700" y="162" text-anchor="middle" font-size="12" fill="#3b6db3">Zaključavanje</text>
  <line x1="722" y1="198" x2="678" y2="198" stroke="#3b6db3" stroke-width="1.4" marker-end="url(#arrow-admin)"/>
  <text x="700" y="228" text-anchor="middle" font-size="12" fill="#3b6db3">Otključavanje</text>
  <!-- completed to reviewed, above -->
  <path d="M330,170 Q480,80 628,168" fill="none" stroke="#3b6db3" stroke-width="1.4" marker-end="url(#arrow-admin)"/>
  <text x="480" y="118" text-anchor="middle" font-size="12" fill="#3b6db3">Pregled</text>
  <!-- synced to locked, above -->
  <path d="M500,170 Q637,30 768,168" fill="none" stroke="#3b6db3" stroke-width="1.4" marker-end="url(#arrow-admin)"/>
  <text x="637" y="92" text-anchor="middle" font-size="12" fill="#3b6db3">Zaključavanje</text>
  <!-- completed to locked, below -->
  <path d="M330,210 Q550,330 768,212" fill="none" stroke="#3b6db3" stroke-width="1.4" marker-end="url(#arrow-admin)"/>
  <text x="550" y="288" text-anchor="middle" font-size="12" fill="#3b6db3">Zaključavanje</text>

  <!-- legend -->
  <line x1="20" y1="380" x2="60" y2="380" stroke="#333" stroke-width="1.4"/>
  <text x="68" y="384" font-size="12">od strane istraživača</text>
  <line x1="270" y1="380" x2="310" y2="380" stroke="#333" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="318" y="384" font-size="12">od strane servera</text>
  <line x1="560" y1="380" x2="600" y2="380" stroke="#3b6db3" stroke-width="1.4"/>
  <text x="608" y="384" font-size="12">od strane administratora</text>
</svg>
