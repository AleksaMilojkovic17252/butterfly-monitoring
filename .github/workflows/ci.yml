# Basic CI. Placeholder until T008 (#25), which replaces it with backend.yml and mobile.yml
# (path filters, APK artifact, README badge). Each job skips its steps while its folder does not
# exist yet, so this stays green before T002/T003/T006 land.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: mobilitydb/mobilitydb:17-3.5-1.3
        env:
          POSTGRES_DB: butterfly
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: echo "yes=$([ -f backend/manage.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.present.outputs.yes == 'true'
        name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libproj-dev binutils
      - if: steps.present.outputs.yes == 'true'
        name: Install dependencies
        # TODO(T003): replace with the project's install command (pip/uv/poetry, lock file).
        run: pip install -r requirements-dev.txt
      - if: steps.present.outputs.yes == 'true'
        name: Checks
        # TODO(T003/T008): add the database env vars that settings.py reads (db on localhost:5432,
        # database butterfly, user/password postgres).
        run: |
          ruff check .
          python manage.py makemigrations --check --dry-run
          pytest
          python manage.py spectacular --validate --file /tmp/schema.yaml

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: echo "yes=$([ -f mobile/pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.present.outputs.yes == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable   # TODO(T006): pin the Flutter version chosen in T006
      - if: steps.present.outputs.yes == 'true'
        name: Checks
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze
          flutter test
          flutter build apk --debug
