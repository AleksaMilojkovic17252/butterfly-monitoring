# Only nginx is published to the host (:8080). Routes follow CONVENTIONS A.3.
# /ogc/ asks Django on every request (auth_request, T069); /sta/ arrives in Phase 2 (T077).

# Results of /_auth (T069). tmpfs in compose: the cache key is the Authorization header in clear.
proxy_cache_path /var/cache/nginx/auth keys_zone=auth_cache:1m max_size=10m inactive=2m use_temp_path=off;

upstream django {
    server django:8000;
}

upstream pygeoapi {
    server pygeoapi:5000;
}

# Use the scheme the client saw (Tailscale serve terminates HTTPS in front of us).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Tailscale serve sends the ts.net name in Host; keep it for Django (USE_X_FORWARDED_HOST).
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;

    # Photo uploads (T049): 15 MB at most, plus headroom. Django answers a body above 15 MB with
    # its own 413 JSON error; nginx's default of 1 MB would refuse every photo.
    client_max_body_size 20m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
    }

    # The user manuals: plain files from docs/manual, no login (they hold example data only).
    # absolute_redirect off keeps the :8080 port, which a redirect to /manual/ would otherwise drop.
    location = /manual {
        absolute_redirect off;
        return 301 /manual/;
    }

    location /manual/ {
        alias /srv/manual/;
        index index.html;
    }

    # pygeoapi's own links are "/ogc?f=json" (no slash); without this they fall through to
    # Django, whose slash redirect drops the :8080 port.
    location = /ogc {
        auth_request /_auth;
        proxy_pass http://pygeoapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    location /ogc/ {
        auth_request /_auth;
        proxy_pass http://pygeoapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    # Only nginx may ask (the ticket's "called only by nginx"); /_auth goes to the upstream directly.
    location = /api/v1/auth/verify {
        return 404;
    }

    location = /_auth {
        internal;
        proxy_pass http://django/api/v1/auth/verify;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Accept "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_cache auth_cache;
        proxy_cache_key $http_authorization;
        proxy_cache_valid 204 60s;
        proxy_ignore_headers Vary;
    }

    # Basemap upload (T060): an MBTiles file of up to 200 MB is posted in the project admin form.
    # Every other path keeps the 20 MB limit above.
    location /admin/projects/project/ {
        client_max_body_size 200m;
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    location / {
        # /api/*, /admin/* and everything else Django serves
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }
}
