# Only nginx is published to the host (:8080). Routes follow CONVENTIONS A.3.
# /ogc/ (T069) and /sta/ (T077) ask Django on every request (auth_request).

# Results of /_auth (T069). tmpfs in compose: the cache key is the Authorization header in clear.
proxy_cache_path /var/cache/nginx/auth keys_zone=auth_cache:1m max_size=10m inactive=2m use_temp_path=off;

upstream django {
    server django:8000;
}

upstream pygeoapi {
    server pygeoapi:5000;
}

upstream frost {
    server frost:8080;
}

# Use the scheme the client saw (Tailscale serve terminates HTTPS in front of us).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Tailscale serve sends the ts.net name in Host; keep it for Django (USE_X_FORWARDED_HOST).
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;

    # Photo uploads (T049): 15 MB at most, plus headroom. Django answers a body above 15 MB with
    # its own 413 JSON error; nginx's default of 1 MB would refuse every photo.
    client_max_body_size 20m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
    }

    # The user manuals: plain files from docs/manual, no login (they hold example data only).
    # absolute_redirect off keeps the :8080 port, which a redirect to /manual/ would otherwise drop.
    location = /manual {
        absolute_redirect off;
        return 301 /manual/;
    }

    location /manual/ {
        alias /srv/manual/;
        index index.html;
    }

    # pygeoapi's own links are "/ogc?f=json" (no slash); without this they fall through to
    # Django, whose slash redirect drops the :8080 port.
    location = /ogc {
        auth_request /_auth;
        proxy_pass http://pygeoapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    location /ogc/ {
        auth_request /_auth;
        proxy_pass http://pygeoapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    # SensorThings API (T077, D-118): /sta/v1.1 is FROST's /FROST-Server/v1.1, admins only. An admin
    # can also write through it. FROST builds links from the request it receives
    # (http://<Host>/FROST-Server/...), so they are rewritten to the address the client used.
    location = /sta {
        absolute_redirect off;
        return 301 /sta/;
    }

    location /sta/ {
        auth_request /_auth;
        proxy_pass http://frost/FROST-Server/;
        # All FROST needs for its links; it reads no X-Forwarded headers as configured.
        proxy_set_header Host $http_host;
        # sub_filter cannot rewrite a compressed answer.
        proxy_set_header Accept-Encoding "";

        # Location headers: of a created entity (absolute) and of Tomcat's redirects (path only).
        proxy_redirect http://$http_host/FROST-Server/ $forwarded_proto://$forwarded_host/sta/;
        proxy_redirect /FROST-Server/ /sta/;

        # Bodies of every type (JSON, GeoJSON, CSV, multipart batch answers).
        sub_filter_types *;
        sub_filter_once off;
        sub_filter 'http://$http_host/FROST-Server/' '$forwarded_proto://$forwarded_host/sta/';
        # The service root lists its entity sets as paths without a host (FROST 2.8.2).
        sub_filter '"url":"/v1.1/' '"url":"$forwarded_proto://$forwarded_host/sta/v1.1/';
    }

    # Only nginx may ask (the ticket's "called only by nginx"); /_auth goes to the upstream directly.
    location = /api/v1/auth/verify {
        return 404;
    }

    location = /_auth {
        internal;
        proxy_pass http://django/api/v1/auth/verify;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Accept "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_cache auth_cache;
        proxy_cache_key $http_authorization;
        proxy_cache_valid 204 60s;
        proxy_ignore_headers Vary;
    }

    # Basemap upload (T060): an MBTiles file of up to 200 MB is posted in the project admin form.
    # Every other path keeps the 20 MB limit above.
    location /admin/projects/project/ {
        client_max_body_size 200m;
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    location / {
        # /api/*, /admin/* and everything else Django serves
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }
}
