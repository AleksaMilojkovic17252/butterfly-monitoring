# Only nginx is published to the host (:8080). Routes follow CONVENTIONS A.3.
# The pygeoapi auth_request is added in T069; /sta/ in Phase 2 (T077).

upstream django {
    server django:8000;
}

upstream pygeoapi {
    server pygeoapi:5000;
}

# Use the scheme the client saw (Tailscale serve terminates HTTPS in front of us).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Tailscale serve sends the ts.net name in Host; keep it for Django (USE_X_FORWARDED_HOST).
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;

    # Photo uploads (T049): 15 MB at most, plus headroom. Django answers a body above 15 MB with
    # its own 413 JSON error; nginx's default of 1 MB would refuse every photo.
    client_max_body_size 20m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
    }

    # pygeoapi's own links are "/ogc?f=json" (no slash); without this they fall through to
    # Django, whose slash redirect drops the :8080 port.
    location = /ogc {
        proxy_pass http://pygeoapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    location /ogc/ {
        proxy_pass http://pygeoapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }

    location / {
        # /api/*, /admin/* and everything else Django serves
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
    }
}
