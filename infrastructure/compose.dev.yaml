# Development overrides: source mounted, auto-reload, DEBUG on.
services:
  django:
    environment:
      DJANGO_DEBUG: "true"
    volumes:
      - ./backend:/app
      - staticfiles:/app/staticfiles
    command:
      - sh
      - -c
      - python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000
