# Run from the repository root:
#   docker compose --project-directory . -f infrastructure/compose.yaml -f infrastructure/compose.dev.yaml up -d
# Relative paths below are relative to the repository root (--project-directory .).
name: butterfly

# Shared by pygeoapi and pygeoapi-cite (T070).
x-pygeoapi: &pygeoapi
  image: geopython/pygeoapi:0.24.0
  environment: &pygeoapi-env
    # Entry point of the official image: listen on 5000 under /ogc (nginx forwards /ogc/ unchanged).
    CONTAINER_HOST: 0.0.0.0
    CONTAINER_PORT: "5000"
    SCRIPT_NAME: /ogc
    # Read by the config file (${VAR} substitution): the read-only role, never django_app.
    POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    PYGEOAPI_DB_USER: ${PYGEOAPI_DB_USER:-pygeoapi_ro}
    PYGEOAPI_DB_PASSWORD: ${PYGEOAPI_DB_PASSWORD:?set in .env}
  volumes:
    - ./pygeoapi/config/pygeoapi-config.yml:/pygeoapi/local.config.yml:ro
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ogc/', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 15s

services:
  db:
    image: mobilitydb/mobilitydb:17-3.5-1.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-django_app}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?set in .env}
      PYGEOAPI_DB_USER: ${PYGEOAPI_DB_USER:-pygeoapi_ro}
      PYGEOAPI_DB_PASSWORD: ${PYGEOAPI_DB_PASSWORD:?set in .env}
      FROST_DB_USER: ${FROST_DB_USER:-frost}
      FROST_DB_PASSWORD: ${FROST_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    # The official MinIO images were removed from Docker Hub and Quay (checked 2026-10-14), so this is
    # the Chainguard build of MinIO (CONVENTIONS A.3 swap path, D-025). Its free tier only has
    # `latest`, so it is pinned by digest (MinIO RELEASE.2026-09-22T19-25-18Z). The image has no mc
    # or curl: the health check uses bash and /dev/tcp.
    image: cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ $$line == *200* ]]'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  django:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-django_app}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?set in .env}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-photos}
      # Django's own MinIO user, created by scripts/minio-setup.sh (T049); never the root user.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set in .env (scripts/minio-setup.sh)}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set in .env (scripts/minio-setup.sh)}
      # Station registration (T078). No depends_on: the admin actions report a FROST that is down.
      FROST_URL: ${FROST_URL:-http://frost:8080/FROST-Server/v1.1}
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  pygeoapi:
    <<: *pygeoapi
    restart: unless-stopped

  # SensorThings API 1.1 (T077, D-118) on its own database `frost`. No ports: nginx serves it at /sta/
  # to admins, containers use http://frost:8080/FROST-Server/v1.1. MQTT (1883, 9876) stays inside the
  # Compose network until T115. Variable names are FROST's setting names with dots as underscores.
  frost:
    image: fraunhoferiosb/frost-server:2.8.2
    environment:
      persistence_db_driver: org.postgresql.Driver
      persistence_db_url: jdbc:postgresql://db:5432/frost
      persistence_db_username: ${FROST_DB_USER:-frost}
      persistence_db_password: ${FROST_DB_PASSWORD:?set in .env}
      persistence_autoUpdateDatabase: "true"
      # FROST builds links from each request it gets, so internal clients get internal links and nginx
      # rewrites them for /sta/. This relies on two defaults: serviceRootUrl empty, and X-Forwarded
      # headers off (turned on, internal links come out as null://).
      # FROST would switch this on by itself, with a warning.
      http_requestDecoder_autodetectRootUrl: "true"
      # MQTT is on by default. With serviceRootUrl empty, the service root answers 500 without this.
      mqtt_exposedEndpoints: mqtt://frost:1883
      JAVA_OPTS: -Xmx768m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Reads a table: the service root answers 200 even without a usable database.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/FROST-Server/v1.1/Things?$$top=1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # OGC CITE (T070, D-113): profile `test`, never started by a plain `up`. A second pygeoapi (same image, config and
  # role) whose links point at itself, because the suite follows self/next links and inside its container
  # `localhost:8080` is the suite. No port, no nginx, no auth.
  pygeoapi-cite:
    <<: *pygeoapi
    profiles: [test]
    environment:
      <<: *pygeoapi-env
      PYGEOAPI_SERVER_URL: http://pygeoapi-cite:5000/ogc

  ets-features:
    image: ogccite/ets-ogcapi-features10:1.8-teamengine-5.7
    profiles: [test]
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      pygeoapi-cite:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/static:ro
      - ./docs/manual:/srv/manual:ro
    # Auth cache (T069): its keys hold the Authorization header, so keep it off disk.
    tmpfs:
      - /var/cache/nginx/auth
    ports:
      - "8080:80"
    depends_on:
      django:
        condition: service_healthy
      pygeoapi:
        condition: service_healthy
      # Only the hostname must resolve at nginx start; Java is slow, so don't wait for its health.
      frost:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  staticfiles:
