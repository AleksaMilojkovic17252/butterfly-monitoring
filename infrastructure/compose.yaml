# Run from the repository root:
#   docker compose --project-directory . -f infrastructure/compose.yaml -f infrastructure/compose.dev.yaml up -d
# Relative paths below are relative to the repository root (--project-directory .).
name: butterfly

services:
  db:
    image: mobilitydb/mobilitydb:17-3.5-1.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-django_app}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?set in .env}
      PYGEOAPI_DB_USER: ${PYGEOAPI_DB_USER:-pygeoapi_ro}
      PYGEOAPI_DB_PASSWORD: ${PYGEOAPI_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    # The official MinIO images were removed from Docker Hub and Quay (checked 2026-10-14), so this is
    # the Chainguard build of MinIO (CONVENTIONS A.3 swap path, D-025). Its free tier only has
    # `latest`, so it is pinned by digest (MinIO RELEASE.2026-09-22T19-25-18Z). The image has no mc
    # or curl: the health check uses bash and /dev/tcp.
    image: cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ $$line == *200* ]]'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  django:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-django_app}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?set in .env}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-photos}
      # Dev shortcut: until a MinIO service account exists (T049), fall back to the root user.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD}}
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  pygeoapi:
    image: geopython/pygeoapi:0.24.0
    environment:
      # Entry point of the official image: listen on 5000 under /ogc (nginx forwards /ogc/ unchanged).
      CONTAINER_HOST: 0.0.0.0
      CONTAINER_PORT: "5000"
      SCRIPT_NAME: /ogc
    volumes:
      - ./pygeoapi/config/pygeoapi-config.yml:/pygeoapi/local.config.yml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ogc/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/static:ro
    ports:
      - "8080:80"
    depends_on:
      django:
        condition: service_healthy
      pygeoapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  staticfiles:
