# pygeoapi configuration (T068): read-only collections over the geo views (T067).
server:
  bind:
    host: 0.0.0.0
    port: 5000
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:8080/ogc}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  language: en-US
  pretty_print: true
  limits:
    default_items: 100
    max_items: 1000
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'

logging:
  level: WARNING

metadata:
  identification:
    title: Butterfly monitoring
    description: Butterfly transect survey data (OGC API - Features, read-only)
    keywords:
      - butterflies
      - monitoring
      - transects
      - pollard walk
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: http://localhost:8080
  license:
    name: CC-BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: Butterfly monitoring (master's thesis)
    url: http://localhost:8080
  contact:
    name: Project maintainer
    email: kolica@live.com

resources:
  transects:
    type: collection
    title: Transects
    description: Monitored butterfly transect routes, one line per transect
    keywords: [transects, monitoring]
    extents:
      # Static and deliberately wide: all of Europe, so a project abroad needs no config change (T068,
      # D-079). Metadata only: it does not filter anything.
      spatial: &spatial_extent
        bbox: [-25, 34, 45, 72]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: PostgreSQL
        # The read-only role (D-004). The views are in geo; PostGIS's types are in public.
        data: &database
          host: db
          port: 5432
          dbname: ${POSTGRES_DB}
          user: ${PYGEOAPI_DB_USER}
          password: ${PYGEOAPI_DB_PASSWORD}
          search_path: [geo, public]
        id_field: id
        table: transects
        geom_field: geometry
        # Not a feature time: the row's creation time, so `datetime` is advertised as OGC API - Features requires (T070, D-113).
        time_field: created_at
        title_field: name

  transect-sections:
    type: collection
    title: Transect sections
    description: Numbered sections of each transect, with habitat and management type
    keywords: [transects, sections, habitat]
    extents:
      spatial: *spatial_extent
    providers:
      - type: feature
        name: PostgreSQL
        data: *database
        id_field: id
        table: transect_sections
        geom_field: geometry
        # As for transects: the row's creation time (T070, D-113).
        time_field: created_at
        title_field: section_code

  butterfly-observations:
    type: collection
    title: Butterfly observations
    description: Butterfly records with the taxon as recorded (taxon_*) and as validated (effective_*)
    keywords: [butterflies, observations]
    extents:
      spatial: *spatial_extent
      # Static: the earliest start and latest end of the live projects' seasons (T068, D-079).
      temporal:
        begin: 2026-03-01T00:00:00Z
        end: 2026-12-31T23:59:59Z
    providers:
      - type: feature
        name: PostgreSQL
        data: *database
        id_field: id
        table: butterfly_observations
        geom_field: geometry
        time_field: observed_at
        title_field: effective_scientific_name

  plant-resources:
    type: collection
    title: Plant records
    description: Host and nectar plants as points or patch polygons, with their role, abundance and state
    keywords: [butterflies, plants, host plants, nectar]
    extents:
      spatial: *spatial_extent
      # Static, as for the observations (T068, D-079).
      temporal:
        begin: 2026-03-01T00:00:00Z
        end: 2026-12-31T23:59:59Z
    providers:
      - type: feature
        name: PostgreSQL
        data: *database
        id_field: id
        table: plant_resources
        geom_field: geometry
        time_field: observed_at
        title_field: plant_scientific_name

  habitat-features:
    type: collection
    title: Habitat features
    description: Habitat type, management, vegetation structure and disturbance of points, lines and polygons
    keywords: [butterflies, habitat, vegetation, management]
    extents:
      spatial: *spatial_extent
      # Static, as for the observations (T068, D-079).
      temporal:
        begin: 2026-03-01T00:00:00Z
        end: 2026-12-31T23:59:59Z
    providers:
      - type: feature
        name: PostgreSQL
        data: *database
        id_field: id
        table: habitat_features
        geom_field: geometry
        time_field: observed_at
        title_field: habitat_type_name_en

  observation-hexgrid:
    type: collection
    title: Observation hexagons
    description: Observations, individuals, species, nectaring and reproductive records per 100 m hexagon
    keywords: [butterflies, observations, hexagon grid, density]
    extents:
      spatial: *spatial_extent
    providers:
      - type: feature
        name: PostgreSQL
        data: *database
        id_field: id
        table: observation_hexgrid
        geom_field: geometry
        # The newest observation counted in the cell, so `datetime` means "newest record in the window" (T070, D-113).
        time_field: last_observed_at
        title_field: id
